<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luyện tập — Toán Bác Long</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#fbf6ec;color:#0c2050}.bar{display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:1px solid #e4d9be;flex-wrap:wrap}.bar a{font-weight:bold;color:#0c2050;text-decoration:none}.bar h1{font-size:19px;margin:0;flex:1}.note{padding:12px 22px;background:#fff4d9;border-bottom:1px solid #efd39c;font-size:13px;line-height:1.5}.frame{width:100%;height:calc(100dvh - 66px);min-height:470px;border:0;background:#fff}.fallback{padding:14px 22px}.fallback a{color:#0c2050}button{border:1px solid #e4d9be;border-radius:7px;background:#f2e9d6;padding:8px;cursor:pointer}@media(max-width:600px){.frame{height:calc(100dvh - 90px)}.bar h1{font-size:16px}}</style></head><body>
<header class="bar"><a href="/app/luyen-theo-khoi.html">← Chọn khối</a><h1 id="grade-title">Toán Bác Long · Luyện tập</h1><button onclick="location.reload()">Tải lại</button></header>

<iframe id="practice" class="frame" title="Luyện tập Toán Bác Long" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
<details class="fallback" id="fallback" style="font-size:12px"><summary>Không xem được bài tập?</summary></details>
<script>
const grade=Number(new URLSearchParams(location.search).get('khoi'));
const source={1:'https://longmath.github.io/khoi_1/',2:'https://longmath.github.io/khoi_2/'}[grade];
const frame=document.getElementById('practice');
if(!source){frame.hidden=true;document.getElementById('fallback').textContent='Khối này chưa có luyện tập tương tác.';}
else{document.getElementById('grade-title').textContent='Luyện tập Khối '+grade+' · Toán Bác Long';frame.src=source;document.getElementById('fallback').innerHTML='Nếu nội dung không hiển thị, <a href="'+source+'" target="_blank" rel="noopener noreferrer">mở bài luyện tập tại đây</a>.';}
</script></body></html>
