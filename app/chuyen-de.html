<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học chuyên đề — Toán Bác Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --paper-deep:#F2E9D6; --navy:#0C2050; --navy-light:#3D5A85;
    --gold:#E3A038; --gold-deep:#C97F1E; --coral:#E63A2E; --green:#178A50; --line:#E4D9BE;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--navy); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; font-weight:700; color:var(--navy);}
  p{margin:0; line-height:1.7; color:var(--navy-light);}
  a{color:inherit;}
  [hidden]{display:none !important;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}
  .wide{max-width:1180px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 16px;} .wide{padding:0 20px;} }

  .tag-soon{display:inline-flex; align-items:center; background:var(--coral); color:#fff; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;}
  .tag{display:inline-flex; align-items:center; font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; white-space:nowrap;}
  .tag.ok{background:#E1F2E7; color:var(--green);}
  .tag.nhap{background:#FFF7E6; color:var(--gold-deep);}

  header{position:sticky; top:0; z-index:50; background:rgba(251,246,236,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  header .bar{display:flex; align-items:center; justify-content:space-between; padding:12px 0; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand img{width:38px; height:38px; border-radius:8px;}
  .brand span{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  nav{display:flex; gap:4px; align-items:center;}
  nav a{text-decoration:none; color:var(--navy-light); font-weight:600; font-size:14px; padding:8px 14px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;}
  nav a:hover, nav a.active{background:var(--paper-deep); color:var(--navy);}
  @media (max-width:920px){ nav{display:none;} }
  .head-actions{display:flex; align-items:center; gap:10px;}
  .btn-outline{color:var(--navy); font-weight:700; font-size:13.5px; border:1.5px solid var(--navy); border-radius:8px; padding:8px 16px; background:none; cursor:pointer; font-family:inherit;}
  .btn-gold{color:var(--navy); font-weight:700; font-size:13.5px; background:linear-gradient(180deg,#F3B85A,var(--gold)); border:none; border-radius:8px; padding:8px 16px; box-shadow:0 3px 0 var(--gold-deep); cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block;}

  .crumbs{font-size:13px; color:var(--navy-light); padding:22px 0 8px;}
  .crumbs a{text-decoration:none; color:var(--gold-deep); font-weight:600;}
  .title h1{font-size:clamp(24px,3.4vw,34px);}
  .meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px;}
  .pill{background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:600;}

  .progress{margin-top:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .progress .row{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:8px;}
  .bar-track{height:9px; border-radius:999px; background:var(--paper-deep); overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--gold),#F6CA6F); border-radius:999px; transition:width .3s ease;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin:22px 0 14px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{border:1px solid var(--line); background:#fff; color:var(--navy-light); font:inherit; font-weight:700; font-size:14px; padding:9px 16px; border-radius:10px; cursor:pointer;}
  .tab.active{background:var(--navy); color:#FFF7E6; border-color:var(--navy);}
  .tab small{opacity:0.7; margin-left:4px; font-weight:500;}
  .langs{display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px;}
  .langs button{border:none; background:none; font:inherit; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:7px; cursor:pointer; color:var(--navy-light);}
  .langs button.on{background:var(--paper-deep); color:var(--navy);}

  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 12px 26px -18px rgba(12,32,80,0.25);}
  .state{padding:36px 20px; text-align:center; color:var(--navy-light);}
  .state h2{margin-bottom:8px;}
  .state.err{color:var(--coral);}
  .state .cta{margin-top:16px;}

  .rich h2{font-size:20px; margin:18px 0 8px;} .rich h3{font-size:17px; margin:16px 0 6px;} .rich h4{font-size:15px; margin:14px 0 6px;}
  .rich h2:first-child,.rich h3:first-child{margin-top:0;}
  .rich p{color:var(--navy); margin:0 0 10px;}
  .rich ul{margin:0 0 10px; padding-left:22px; color:var(--navy);} .rich li{margin-bottom:4px; line-height:1.6;}

  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  th{text-align:left; font-size:12px; color:var(--navy-light); padding:8px 10px; border-bottom:1.5px solid var(--line);}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .say{border:1px solid var(--line); background:var(--paper); border-radius:8px; cursor:pointer; padding:4px 9px; font-size:14px;}
  .say:hover{border-color:var(--gold);}

  .prob{margin-bottom:16px;}
  .prob-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .prob-no{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
  .prob-src{font-size:12px; color:var(--navy-light);}
  .stmt{white-space:pre-wrap; color:var(--navy); line-height:1.7; font-size:15.5px;}
  .stmt.en{color:var(--navy-light); font-size:14px; font-style:italic; margin-top:8px;}
  .field-label{display:block; font-size:12px; font-weight:700; color:var(--navy-light); margin:14px 0 5px;}
  .work{width:100%; min-height:72px; padding:10px 12px; border:1.5px dashed var(--line); border-radius:10px; font:inherit; font-size:14px; resize:vertical; background:var(--paper);}
  .ans-row{display:flex; gap:8px; flex-wrap:wrap;}
  .ans-row input{flex:1; min-width:140px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:15px;}
  .btn{border:none; font:inherit; font-weight:700; font-size:13.5px; border-radius:9px; padding:10px 16px; cursor:pointer;}
  .btn.primary{background:linear-gradient(180deg,#F3B85A,var(--gold)); color:var(--navy); box-shadow:0 3px 0 var(--gold-deep);}
  .btn.ghost{background:var(--paper-deep); color:var(--navy);}
  .btn:disabled{opacity:0.55; cursor:not-allowed;}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .hint{background:#FFF7E6; border:1px solid #F1DDAE; border-radius:10px; padding:10px 12px; margin-top:10px; font-size:14px; color:var(--navy);}
  .hint b{color:var(--gold-deep);}
  .fb{margin-top:10px; border-radius:10px; padding:11px 13px; font-size:14px;}
  .fb.good{background:#E1F2E7; color:#0f5c36; border:1px solid #b9e0c7;}
  .fb.bad{background:#FDEDEA; color:#9c2a20; border:1px solid #f5c6c0;}
  .fb.info{background:#EAF1FB; color:#164a7d; border:1px solid #c7dbf1;}
  .fb .rich p, .fb .rich ul{color:inherit;}
  .solved-mark{color:var(--green);}

  footer{border-top:1px solid var(--line); padding:32px 0; margin-top:40px;}
  .foot-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
  .foot-links{display:flex; gap:20px;}
  .foot-links a{font-size:13.5px; text-decoration:none; color:var(--navy-light); font-weight:600;}
  .foot-fine{margin-top:16px; font-size:12px; color:var(--navy-light);}

  #modal{position:fixed; inset:0; background:rgba(12,32,80,0.55); z-index:100; align-items:center; justify-content:center; padding:20px; display:none;}
  #modal.open{display:flex;}
  .modal-box{background:#fff; border-radius:20px; padding:30px; max-width:400px; width:100%; position:relative;}
  .modal-box .x{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--navy-light);}
  .tabs2{display:flex; gap:8px; margin-bottom:20px;}
  .tabs2 button{flex:1; padding:10px; border-radius:10px; border:none; font-weight:700; font-family:'Space Grotesk',sans-serif; cursor:pointer; background:var(--paper-deep); color:var(--navy);}
  .tabs2 button.on{background:var(--navy); color:#fff;}
  .modal-box label{display:block; font-size:12.5px; font-weight:700; margin:12px 0 5px;}
  .modal-box input{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:14px;}
  .msg{font-size:13px; margin-top:10px;} .msg.err{color:var(--coral);} .msg.ok{color:var(--green);}
  #toast{position:fixed; right:18px; bottom:18px; z-index:120; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--navy); color:#FFF7E6; padding:10px 14px; border-radius:10px; font-size:13.5px; max-width:340px;}
  .toast.err{background:var(--coral);}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- MENU TRÊN ĐIỆN THOẠI ---------- */
  .burger { display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:0; padding:10px 6px; }
  .burger span { width:24px; height:2px; background:var(--navy); transition:transform .2s ease, opacity .2s ease; }
  .burger.on span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .burger.on span:nth-child(2) { opacity:0; }
  .burger.on span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  .burger:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
  .mobile-menu { display:none; }
  @media (max-width:920px) {
    .burger { display:flex; }
    .head-actions { margin-left:auto; }
    .mobile-menu.open { display:block; position:absolute; left:0; right:0; top:100%; background:var(--paper); border-bottom:1px solid var(--line); box-shadow:0 18px 30px -12px rgba(12,32,80,0.25); padding:6px 24px 14px; max-height:calc(100vh - 70px); overflow-y:auto; }
    .mobile-menu a { display:block; padding:14px 4px; color:var(--navy); font-weight:600; font-size:16px; text-decoration:none; border-bottom:1px solid var(--line); }
    .mobile-menu a:last-child { border-bottom:0; }
    .mobile-menu a.active { color:var(--gold-deep); }
  }
  @media (max-width:640px) {
    header .bar { gap:8px; }
    .brand span { font-size:16px; }
    .head-actions { gap:6px; }
    .btn-outline, .btn-gold { padding:7px 11px; font-size:12.5px; }
    #greeting, #auth-greeting, .head-actions .tag-soon { display:none; }
  }
  @media (max-width:440px) { .brand span { display:none; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  var SUPABASE_URL = 'https://vmttxgndosucjpysdrzg.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtdHR4Z25kb3N1Y2pweXNkcnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMTE5NjcsImV4cCI6MjEwNDg4Nzk2N30.q79YcNPMQhhtOhp3ei1kWV03_TdORAx1PnJi3BgYXlU';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var $ = function (id) { return document.getElementById(id); };

  var user = null, isAdmin = false, lastUid;

  // Quyền gói trả phí của tài khoản đang đăng nhập. Phải lọc theo user_id vì tài khoản admin đọc được quyền của mọi người.
  var ENT = [];
  async function fetchEntitlements() {
    if (!user) return [];
    var r = await sb.from('entitlements').select('exam_id,level_id,khoi,tat_ca,het_han').eq('user_id', user.id);
    return r.error ? [] : (r.data || []);
  }
  // lv là dòng bảng đề, ex là dòng kỳ thi chứa nó. Quyền theo khối chỉ mở bảng đề có ghi khối VÀ thuộc một "Chương trình"
  // (không mở các kỳ thi Olympic). Quyền theo kỳ thi, theo bảng đề và Tất cả không phụ thuộc điều này.
  function entitledForLevel(lv, ex) {
    if (!lv) return false;
    var now = new Date();
    return ENT.some(function (e) {
      if (e.het_han && new Date(e.het_han) <= now) return false;
      return e.tat_ca || e.level_id === lv.id || e.exam_id === lv.exam_id ||
        (e.khoi != null && lv.khoi_tu != null && lv.khoi_den != null && e.khoi >= lv.khoi_tu && e.khoi <= lv.khoi_den &&
         !!ex && ex.loai === 'chuong_trinh');
    });
  }
  var topicId = '';
  var T = null;            // dữ liệu chuyên đề đang xem
  var ST = {};             // trạng thái từng bài: { hints, solved, revealed }
  var tab = 'ly-thuyet';
  var lang = 'both';
  try { lang = localStorage.getItem('lm-lang') || 'both'; } catch (e) {}

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, type) {
    var el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg;
    $('toast').appendChild(el); setTimeout(function () { el.remove(); }, 4500);
  }
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

  /* Hiển thị văn bản có định dạng nhẹ: ## tiêu đề, - gạch đầu dòng, **đậm**. Luôn thoát ký tự trước. */
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function renderRich(src) {
    var out = [], para = [], list = false;
    function flush() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function close() { if (list) { out.push('</ul>'); list = false; } }
    String(src || '').split(/\r?\n/).forEach(function (l) {
      var t = l.trim();
      if (!t) { flush(); close(); return; }
      var h = t.match(/^(#{1,3})\s+(.*)$/);
      if (h) { flush(); close(); var lv = h[1].length >= 3 ? 3 : 2; out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); return; }
      if (/^[-*]\s+/.test(t)) { flush(); if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(t.replace(/^[-*]\s+/, '')) + '</li>'); return; }
      close(); para.push(t);
    });
    flush(); close();
    return out.join('');
  }

  function showState(html, isErr) {
    var s = $('state'); s.hidden = false; s.className = 'card state' + (isErr ? ' err' : ''); s.innerHTML = html;
    $('view').hidden = true;
  }
  function rpcError(e) {
    var m = (e && e.message) || '';
    if (/Khong co quyen/i.test(m)) return 'Bạn chưa có quyền với bài này. Hãy đăng nhập lại hoặc liên hệ Toán Bác Long.';
    if (/chua co dap so/i.test(m)) return 'Bài này chưa có đáp số.';
    if (/Muc goi y/i.test(m)) return 'Mức gợi ý không hợp lệ.';
    return 'Chưa xử lý được lúc này. Bạn thử lại sau ít phút.';
  }

  /* ---------- TẢI DỮ LIỆU ---------- */
  async function loadAll() {
    topicId = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    T = null; ST = {};
    if (!topicId) { showState('<h2>Chưa chọn chuyên đề</h2><p>Hãy chọn một chuyên đề trong kho.</p><p class="cta"><a class="btn-gold" href="luyen-thi-olympic.html">Mở kho chuyên đề</a></p>'); return; }
    showState('Đang tải chuyên đề...');
    var t = await sb.from('topics').select('*').eq('id', topicId).maybeSingle();
    if (t.error) { showState('<h2>Chưa tải được dữ liệu</h2><p>Bạn thử tải lại trang sau ít phút.</p>', true); return; }
    if (!t.data) { showState('<h2>Không tìm thấy chuyên đề</h2><p>Chuyên đề không tồn tại hoặc chưa được đăng.</p><p class="cta"><a class="btn-gold" href="luyen-thi-olympic.html">Về kho chuyên đề</a></p>'); return; }
    var topic = t.data;
    var lv = await sb.from('exam_levels').select('*').eq('id', topic.level_id).maybeSingle();
    var ex = lv.data ? await sb.from('exams').select('*').eq('id', lv.data.exam_id).maybeSingle() : { data: null };
    T = { topic: topic, level: lv.data, exam: ex.data, theory: '', terms: [], problems: [], locked: null };

    if (topic.access_level !== 'cong_khai' && !user) { T.locked = 'login'; renderAll(); return; }
    if (topic.access_level === 'tra_phi' && !isAdmin && !entitledForLevel(lv.data, ex.data)) { T.locked = 'paid'; renderAll(); return; }

    var r = await Promise.all([
      sb.from('topic_content').select('*').eq('topic_id', topicId).maybeSingle(),
      sb.from('topic_terms').select('*').eq('topic_id', topicId).order('thu_tu'),
      sb.from('problems').select('*').eq('topic_id', topicId).order('so_thu_tu')
    ]);
    for (var i = 0; i < r.length; i++) if (r[i].error) { showState('<h2>Chưa tải được nội dung</h2><p>Bạn thử tải lại trang sau ít phút.</p>', true); return; }
    T.theory = (r[0].data && r[0].data.ly_thuyet) || '';
    T.terms = r[1].data || []; T.problems = r[2].data || [];
    T.problems.forEach(function (p) { ST[p.id] = { hints: 0, solved: false, revealed: false }; });
    if (user && T.problems.length) {
      var lg = await sb.from('practice_log').select('problem_id,correct,revealed').eq('topic_id', topicId);
      if (!lg.error) (lg.data || []).forEach(function (x) { if (ST[x.problem_id] && x.correct) ST[x.problem_id].solved = true; });
    }
    if (!T.theory.trim() && T.problems.length) tab = 'bai-tap';
    renderAll();
  }

  /* ---------- HIỂN THỊ ---------- */
  function renderAll() {
    $('state').hidden = true; $('view').hidden = false;
    var tp = T.topic, lvl = T.level, ex = T.exam;
    $('crumbs').innerHTML = '<a href="toanbaclong-platform.html">Trang chủ</a> / <a href="luyen-thi-olympic.html' + (lvl ? '#' + esc(lvl.id) : '') + '">Luyện thi Olympic</a>' +
      (ex ? ' / ' + esc(ex.ten) : '') + (lvl ? ' / ' + esc(lvl.ten) : '');
    $('topic-name').textContent = tp.ten;
    $('topic-meta').innerHTML = (tp.nhom ? '<span class="pill">Nhóm ' + esc(tp.nhom) + '</span>' : '') +
      (lvl ? '<span class="pill">' + esc(lvl.ten) + '</span>' : '') +
      (tp.trang_thai !== 'da_dang' ? '<span class="tag nhap">Nháp</span>' : '');
    $('n-terms').textContent = T.terms.length ? '(' + T.terms.length + ')' : '';
    $('n-probs').textContent = T.problems.length ? '(' + T.problems.length + ')' : '';
    renderLangs(); renderProgress(); renderPanes(); setTab(tab);
  }

  function renderLangs() {
    document.querySelectorAll('#langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === lang); });
  }
  function renderProgress() {
    var total = T.problems.length, done = T.problems.filter(function (p) { return ST[p.id] && ST[p.id].solved; }).length;
    var box = $('progress');
    if (!total || T.locked) { box.hidden = true; return; }
    box.hidden = false;
    $('progress-link').hidden = !user;
    if (!user) { $('progress-label').textContent = total + ' bài. Đăng nhập để lưu tiến độ của con.'; $('progress-pct').textContent = ''; $('progress-fill').style.width = '0%'; return; }
    var pct = Math.round(done * 100 / total);
    $('progress-label').textContent = 'Đã giải ' + done + '/' + total + ' bài';
    $('progress-pct').textContent = pct + '%';
    $('progress-fill').style.width = pct + '%';
  }
  function lockedHtml() {
    if (T.locked === 'login') return '<div class="state"><h2>Đăng nhập để học chuyên đề này</h2><p>Chuyên đề dành cho thành viên đã đăng nhập. Tạo tài khoản miễn phí chỉ mất một phút.</p><p style="margin-top:10px; font-size:14px;"><a href="../index.html#hocphi" style="color:var(--gold-deep); font-weight:700; text-decoration:none;">Xem các gói và quyền lợi tài khoản →</a></p><p class="cta"><button class="btn-gold" type="button" data-open="login">Đăng nhập</button> <button class="btn-outline" type="button" data-open="register">Đăng ký</button></p></div>';
    if (T.locked === 'paid') return '<div class="state"><h2>Chuyên đề thuộc gói trả phí</h2><p>Hãy liên hệ Toán Bác Long để được tư vấn và mở chuyên đề này cho con.</p><p style="margin-top:10px; font-size:14px;"><a href="../index.html#hocphi" style="color:var(--gold-deep); font-weight:700; text-decoration:none;">Xem các gói và quyền lợi tài khoản →</a></p></div>';
    return '';
  }
  function renderPanes() {
    if (T.locked) { ['ly-thuyet', 'so-tay', 'bai-tap'].forEach(function (k) { $('pane-' + k).innerHTML = lockedHtml(); }); return; }
    $('pane-ly-thuyet').innerHTML = T.theory.trim() ? renderRich(T.theory) : '<p class="muted">Lý thuyết của chuyên đề này đang được cập nhật. <span class="tag-soon">Sắp ra mắt</span></p>';
    $('pane-so-tay').innerHTML = T.terms.length
      ? '<table><thead><tr><th>English</th><th>Tiếng Việt</th><th></th></tr></thead><tbody>' + T.terms.map(function (m) {
          return '<tr><td><b>' + esc(m.en) + '</b></td><td>' + esc(m.vi) + '</td><td><button class="say" type="button" data-say="' + esc(m.en) + '" aria-label="Nghe đọc ' + esc(m.en) + '">🔊</button></td></tr>';
        }).join('') + '</tbody></table>'
      : '<p>Sổ tay từ khoá của chuyên đề này đang được cập nhật. <span class="tag-soon">Sắp ra mắt</span></p>';
    renderProblems();
  }

  function stmtHtml(p) {
    var vi = p.de_vi, en = p.de_en;
    if (lang === 'vi') return '<div class="stmt">' + esc(vi || en) + '</div>';
    if (lang === 'en') return '<div class="stmt">' + esc(en || vi) + '</div>';
    return (vi ? '<div class="stmt">' + esc(vi) + '</div>' : '') + (en ? '<div class="stmt ' + (vi ? 'en' : '') + '">' + esc(en) + '</div>' : '');
  }
  function renderProblems() {
    var pane = $('pane-bai-tap');
    if (!T.problems.length) { pane.innerHTML = '<div class="card"><p>Bài tập của chuyên đề này đang được cập nhật. <span class="tag-soon">Sắp ra mắt</span></p></div>'; return; }
    // Giữ lại nội dung đang gõ khi vẽ lại (ví dụ đổi ngôn ngữ)
    var keep = {};
    pane.querySelectorAll('.prob').forEach(function (el) {
      keep[el.dataset.id] = { ans: el.querySelector('.ans').value, fb: el.querySelector('.fb-area').innerHTML };
    });
    pane.innerHTML = T.problems.map(function (p) {
      var s = ST[p.id] || {};
      return '<article class="card prob" data-id="' + esc(p.id) + '">' +
        '<div class="prob-head"><span class="prob-no">Bài ' + esc(p.so_thu_tu) + '</span>' +
        '<span class="tag ok solved-tag"' + (s.solved ? '' : ' hidden') + '>✓ Đã giải</span>' +
        (p.trang_thai !== 'da_dang' ? '<span class="tag nhap">Nháp</span>' : '') +
        (p.nguon ? '<span class="prob-src">Nguồn: ' + esc(p.nguon) + '</span>' : '') + '</div>' +
        stmtHtml(p) +
        '<label class="field-label" for="w-' + esc(p.id) + '">Chỗ trình bày bài làm (chỉ lưu trên máy này)</label>' +
        '<textarea class="work" id="w-' + esc(p.id) + '" data-work="' + esc(p.id) + '"></textarea>' +
        '<label class="field-label" for="a-' + esc(p.id) + '">Đáp số của con</label>' +
        '<div class="ans-row"><input class="ans" id="a-' + esc(p.id) + '" type="text" autocomplete="off" inputmode="text" placeholder="Nhập đáp số">' +
        '<button class="btn primary" type="button" data-act="check">Kiểm tra</button></div>' +
        '<div class="actions"><button class="btn ghost" type="button" data-act="hint1">Gợi ý 1</button>' +
        '<button class="btn ghost" type="button" data-act="hint2">Gợi ý 2</button>' +
        '<button class="btn ghost" type="button" data-act="reveal">Xem đáp án</button></div>' +
        '<div class="fb-area"></div></article>';
    }).join('');
    pane.querySelectorAll('.prob').forEach(function (el) {
      var id = el.dataset.id;
      el.querySelector('.work').value = lsGet('lm-work:' + id);
      if (keep[id]) { el.querySelector('.ans').value = keep[id].ans; el.querySelector('.fb-area').innerHTML = keep[id].fb; }
    });
  }

  function setTab(name) {
    tab = name;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    ['ly-thuyet', 'so-tay', 'bai-tap'].forEach(function (k) { $('pane-' + k).hidden = (k !== name); });
    $('langs').hidden = (name !== 'bai-tap');
  }

  /* ---------- LÀM BÀI ---------- */
  function fb(card, kind, html) { card.querySelector('.fb-area').innerHTML = '<div class="fb ' + kind + '">' + html + '</div>'; }
  function addFb(card, kind, html) { card.querySelector('.fb-area').insertAdjacentHTML('beforeend', '<div class="fb ' + kind + '">' + html + '</div>'); }

  async function doCheck(card, btn) {
    var id = card.dataset.id, st = ST[id], ans = card.querySelector('.ans').value.trim();
    if (!ans) { fb(card, 'info', 'Hãy nhập đáp số của con trước khi kiểm tra.'); return; }
    btn.disabled = true;
    var r = await sb.rpc('check_answer', { p_problem: id, p_answer: ans, p_hints: st.hints });
    btn.disabled = false;
    if (r.error) { fb(card, 'bad', esc(rpcError(r.error))); return; }
    if (r.data && r.data.correct) {
      st.solved = true;
      card.querySelector('.solved-tag').hidden = false;
      fb(card, 'good', '<b>✓ Chính xác!</b> Đáp số: <b>' + esc(r.data.dap_so) + '</b>' + (r.data.loi_giai ? '<div class="rich" style="margin-top:8px;">' + renderRich(r.data.loi_giai) + '</div>' : ''));
      renderProgress();
    } else {
      fb(card, 'bad', 'Chưa đúng. Con thử lại, hoặc xem gợi ý nhé.');
    }
  }
  async function doHint(card, level, btn) {
    var id = card.dataset.id, st = ST[id];
    if (level === 2 && st.hints < 1) { fb(card, 'info', 'Hãy xem gợi ý 1 trước nhé.'); return; }
    btn.disabled = true;
    var r = await sb.rpc('get_hint', { p_problem: id, p_level: level });
    btn.disabled = false;
    if (r.error) { fb(card, 'bad', esc(rpcError(r.error))); return; }
    st.hints = Math.max(st.hints, level);
    var box = card.querySelector('.fb-area');
    var html = r.data ? '<div class="hint"><b>Gợi ý ' + level + ':</b> ' + esc(r.data) + '</div>' : '<div class="hint">Bài này chưa có gợi ý mức ' + level + '.</div>';
    box.insertAdjacentHTML('beforeend', html);
  }
  async function doReveal(card, btn) {
    if (!window.confirm('Xem đáp án sẽ không được tính là con tự giải. Tiếp tục?')) return;
    var id = card.dataset.id;
    btn.disabled = true;
    var r = await sb.rpc('reveal_answer', { p_problem: id });
    btn.disabled = false;
    if (r.error) { fb(card, 'bad', esc(rpcError(r.error))); return; }
    ST[id].revealed = true;
    fb(card, 'info', 'Đáp số: <b>' + esc(r.data.dap_so) + '</b>' + (r.data.loi_giai ? '<div class="rich" style="margin-top:8px;">' + renderRich(r.data.loi_giai) + '</div>' : ''));
  }
  function say(text) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) { toast('Trình duyệt này chưa hỗ trợ đọc to.', 'err'); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  /* ---------- SỰ KIỆN ---------- */
  document.addEventListener('click', function (ev) {
    var open = ev.target.closest('[data-open]'); if (open) { openModal(open.dataset.open); return; }
    var tb = ev.target.closest('.tab'); if (tb) { setTab(tb.dataset.tab); return; }
    var lb = ev.target.closest('[data-lang]');
    if (lb) { lang = lb.dataset.lang; lsSet('lm-lang', lang); renderLangs(); renderProblems(); return; }
    var sy = ev.target.closest('[data-say]'); if (sy) { say(sy.dataset.say); return; }
    var ab = ev.target.closest('button[data-act]');
    if (ab) {
      var card = ab.closest('.prob'); if (!card) return;
      if (ab.dataset.act === 'check') doCheck(card, ab);
      else if (ab.dataset.act === 'hint1') doHint(card, 1, ab);
      else if (ab.dataset.act === 'hint2') doHint(card, 2, ab);
      else if (ab.dataset.act === 'reveal') doReveal(card, ab);
    }
  });
  document.addEventListener('input', function (ev) {
    var w = ev.target.closest('[data-work]'); if (w) lsSet('lm-work:' + w.dataset.work, w.value);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('ans')) {
      ev.preventDefault();
      var card = ev.target.closest('.prob'); if (card) doCheck(card, card.querySelector('[data-act=check]'));
    }
  });
  window.addEventListener('hashchange', function () { if (decodeURIComponent((location.hash || '').replace(/^#/, '')) !== topicId) loadAll(); });

  /* ---------- ĐĂNG NHẬP ---------- */
  function openModal(mt) { $('modal').classList.add('open'); switchMTab(mt); }
  function closeModal() { $('modal').classList.remove('open'); }
  function switchMTab(mt) {
    var login = mt === 'login';
    $('form-login').hidden = !login; $('form-register').hidden = login;
    $('tab-login').classList.toggle('on', login); $('tab-register').classList.toggle('on', !login);
  }
  $('modal-close').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
  document.querySelectorAll('[data-mtab]').forEach(function (b) { b.addEventListener('click', function () { switchMTab(b.dataset.mtab); }); });
  $('form-login').addEventListener('submit', async function (ev) {
    ev.preventDefault(); var err = $('login-error'); err.hidden = true;
    var r = await sb.auth.signInWithPassword({ email: $('login-email').value.trim(), password: $('login-password').value });
    if (r.error) { err.textContent = /Invalid login/i.test(r.error.message) ? 'Sai email hoặc mật khẩu.' : 'Đăng nhập chưa được: ' + r.error.message; err.hidden = false; return; }
    closeModal();
  });
  $('form-register').addEventListener('submit', async function (ev) {
    ev.preventDefault(); var err = $('register-error'), ok = $('register-success'); err.hidden = true; ok.hidden = true;
    var r = await sb.auth.signUp({ email: $('reg-email').value.trim(), password: $('reg-password').value,
      options: { data: { ho_ten: $('reg-hoten').value.trim(), so_dien_thoai: $('reg-phone').value.trim() } } });
    if (r.error) { err.textContent = 'Đăng ký chưa được: ' + r.error.message; err.hidden = false; return; }
    ok.textContent = 'Tạo tài khoản thành công. Nếu được yêu cầu xác nhận email, hãy kiểm tra hộp thư.'; ok.hidden = false;
  });
  $('btn-logout').addEventListener('click', function () { sb.auth.signOut(); });

  async function applySession(session) {
    var uid = session && session.user ? session.user.id : null;
    if (lastUid !== undefined && uid === lastUid) return;
    lastUid = uid; user = session ? session.user : null; isAdmin = false;
    $('auth-out').hidden = !!user; $('auth-in').hidden = !user;
    if (user) {
      $('greeting').textContent = 'Xin chào, ' + ((user.user_metadata && user.user_metadata.ho_ten) || user.email);
      var r = await sb.rpc('is_admin'); isAdmin = !r.error && r.data === true;
    }
    ENT = await fetchEntitlements();
    await loadAll();
  }
  sb.auth.onAuthStateChange(function (_e, session) { setTimeout(function () { applySession(session); }, 0); });
  sb.auth.getSession().then(function (r) { applySession(r.data ? r.data.session : null); });
</script>

<script>
(function () {
  var burger = document.querySelector('.burger'), menu = document.getElementById('mobile-menu'), nav = document.querySelector('header nav');
  if (!burger || !menu || !nav) return;
  Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
    var item = document.createElement('a');
    item.href = a.getAttribute('href'); item.textContent = a.textContent.trim();
    if (a.classList.contains('active')) item.className = 'active';
    menu.appendChild(item);
  });
  function setOpen(open) {
    menu.classList.toggle('open', open); burger.classList.toggle('on', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu');
  }
  burger.addEventListener('click', function () { setOpen(!menu.classList.contains('open')); });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  document.addEventListener('click', function (e) { if (!menu.contains(e.target) && !burger.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 920) setOpen(false); });
})();
</script>
</body>
</html>
